<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro — Neuronix</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div id="toast-container"></div>

<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">🧠 Neuronix</div>
    <p class="auth-subtitle">Crea tu cuenta y empieza a construir hábitos poderosos.</p>

    <form id="form-register">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input id="nombre" type="text" class="form-control" placeholder="Juan" required />
        </div>
        <div class="form-group">
          <label for="apellido">Apellido</label>
          <input id="apellido" type="text" class="form-control" placeholder="Pérez" required />
        </div>
      </div>
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" class="form-control" placeholder="tu@email.com" required />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" class="form-control" placeholder="Mínimo 8 caracteres" required minlength="8" />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">
        🚀 Crear cuenta gratis
      </button>
    </form>

    <p class="auth-switch">
      ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
    </p>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
