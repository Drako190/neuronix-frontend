<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nueva contraseña — Neuronix</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div id="toast-container"></div>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">🧠 Neuronix</div>
    <p class="auth-subtitle">Elige una nueva contraseña segura.</p>
    <form id="form-reset">
      <div class="form-group">
        <label for="password">Nueva contraseña</label>
        <input id="password" type="password" class="form-control" placeholder="Mínimo 8 caracteres" required minlength="8" />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">
        Guardar contraseña
      </button>
    </form>
    <p class="auth-switch"><a href="login.html">← Volver al login</a></p>
  </div>
</div>
<script src="../js/config.js"></script>
<script>
document.getElementById('form-reset').addEventListener('submit', async (e) => {
  e.preventDefault();
  const token = new URLSearchParams(window.location.search).get('token');
  if (!token) return toast('Token inválido', 'error');
  try {
    await apiFetch(`/auth/reset-password/${token}`, {
      method: 'POST',
      body: JSON.stringify({ password: document.getElementById('password').value })
    });
    toast('✅ Contraseña actualizada');
    setTimeout(() => window.location.href = 'login.html', 1500);
  } catch (err) { toast(err.message, 'error'); }
});
</script>
</body>
</html>
