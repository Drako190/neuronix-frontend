<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar contraseña — Neuronix</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div id="toast-container"></div>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">🧠 Neuronix</div>
    <p class="auth-subtitle">Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.</p>
    <form id="form-forgot">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" class="form-control" placeholder="tu@email.com" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">
        Enviar enlace
      </button>
    </form>
    <p class="auth-switch"><a href="login.html">← Volver al login</a></p>
  </div>
</div>
<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
