<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hábitos — Neuronix</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<nav class="navbar">
  <a class="nav-brand" href="dashboard.html">Neuro<span>nix</span></a>
  <div class="nav-links">
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="habitos.html" class="active">🔥 Hábitos</a>
    <a href="pomodoro.html">🍅 Pomodoro</a>
    <a href="metas.html">🎯 Metas</a>
    <a href="notas.html">📝 Notas</a>
    <a href="perfil.html">👤 Perfil</a>
  </div>
  <div class="nav-user">
    <div class="user-info">
      <strong id="user-nombre">—</strong>
    </div>
    <button id="btn-logout" class="btn-logout">Salir</button>
  </div>
</nav>

<div id="toast-container"></div>

<div class="page-wrapper">
  <h1 class="page-title">Mis <span style="color:var(--cyan)">Hábitos</span></h1>
  <p class="page-subtitle">Gestiona los hábitos que forman parte de tu rutina diaria.</p>

  <div style="display:grid;grid-template-columns:1fr 280px;gap:2rem;align-items:start">
    <!-- Catálogo -->
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:1rem">
        <h2 class="section-title" style="margin:0">Catálogo de hábitos</h2>
        <input type="text" id="search-habitos" class="search-input" placeholder="Buscar hábito..." />
      </div>

      <!-- Filtros por categoría -->
      <div class="filters">
        <button class="filter-btn active" data-cat="todos">Todos</button>
        <button class="filter-btn" data-cat="estudio">📚 Estudio</button>
        <button class="filter-btn" data-cat="productividad">⚡ Productividad</button>
        <button class="filter-btn" data-cat="salud">💪 Salud</button>
        <button class="filter-btn" data-cat="mindfulness">🧘 Mindfulness</button>
        <button class="filter-btn" data-cat="lectura">📖 Lectura</button>
        <button class="filter-btn" data-cat="ejercicio">🏃 Ejercicio</button>
        <button class="filter-btn" data-cat="sueno">😴 Sueño</button>
      </div>

      <div id="catalogo-habitos" class="catalog-grid">
        <div class="empty-state"><span>⏳</span><p>Cargando catálogo...</p></div>
      </div>
    </div>

    <!-- Mis hábitos (barra lateral) -->
    <div class="card" style="position:sticky;top:80px">
      <h3 style="margin-bottom:1rem;font-size:0.9rem;color:var(--text-m);text-transform:uppercase;letter-spacing:1px">Mis hábitos activos</h3>
      <div id="mis-habitos-list"></div>
    </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/habitos.js"></script>
</body>
</html>
